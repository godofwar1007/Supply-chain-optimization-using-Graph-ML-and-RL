<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Data2Delivery | Command Center</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/style.css">
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#0d1322",
                      "outline-variant": "#3c4a46",
                      "surface-bright": "#33394a",
                      "on-tertiary": "#00382d",
                      "on-primary-container": "#00473c",
                      "surface-variant": "#2f3445",
                      "surface-tint": "#44ddc1",
                      "surface-container-highest": "#2f3445",
                      "on-surface": "#dde2f8",
                      "primary": "#44ddc1",
                      "primary-fixed-dim": "#44ddc1",
                      "on-secondary-fixed-variant": "#065043",
                      "on-surface-variant": "#bbcac4",
                      "on-tertiary-fixed": "#002019",
                      "primary-fixed": "#68fadd",
                      "error": "#ffb4ab",
                      "surface-container-lowest": "#080e1d",
                      "tertiary-container": "#00c09f",
                      "on-secondary-container": "#86c5b3",
                      "on-error-container": "#ffdad6",
                      "surface-container": "#191f2f",
                      "on-primary-fixed-variant": "#005145",
                      "on-primary-fixed": "#00201a",
                      "tertiary-fixed-dim": "#38debb",
                      "outline": "#85948f",
                      "error-container": "#93000a",
                      "inverse-on-surface": "#2a3040",
                      "on-tertiary-container": "#00483a",
                      "on-error": "#690005",
                      "on-secondary": "#00382e",
                      "on-primary": "#00382f",
                      "on-secondary-fixed": "#00201a",
                      "on-tertiary-fixed-variant": "#005142",
                      "surface-container-low": "#151b2b",
                      "secondary-container": "#0b5345",
                      "tertiary-fixed": "#5ffbd6",
                      "surface-container-high": "#242a3a",
                      "primary-container": "#00bfa5",
                      "secondary-fixed-dim": "#94d3c1",
                      "on-background": "#dde2f8",
                      "inverse-primary": "#006b5c",
                      "secondary-fixed": "#afefdd",
                      "inverse-surface": "#dde2f8",
                      "surface-dim": "#0d1322",
                      "secondary": "#94d3c1",
                      "background": "#0d1322",
                      "tertiary": "#38debb"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "fontFamily": {
                      "headline": ["Manrope"],
                      "display": ["Manrope"],
                      "body": ["Inter"],
                      "label": ["Space Grotesk"]
              }
            },
          }
        }
      </script>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30 h-screen overflow-hidden">
<!-- TopNavBar -->
<header class="bg-[#0d1322]/80 backdrop-blur-xl border-b border-outline-variant/10 docked full-width top-0 z-50 flex justify-between items-center w-full px-6 h-16 fixed">
<div class="flex items-center gap-8">
<div class="text-2xl font-black text-[#44ddc1] tracking-tighter font-headline">Data2Delivery</div>
</div>
<div class="flex items-center gap-4">
<div class="status-badge px-4 py-1.5 bg-surface-container-low rounded-full border border-outline-variant/20 flex items-center" id="status-badge">
    <span class="status-dot"></span>
    <span class="status-text text-[11px] font-label uppercase tracking-wider text-on-surface-variant">Ready</span>
</div>
</div>
</header>

<div class="flex pt-16 h-screen">
<!-- Sidebar -->
<aside class="bg-[#151b2b] flex flex-col w-72 border-r border-[#3c4a46]/20 z-40 overflow-y-auto pb-10">
    <div class="p-6 space-y-8">
        <!-- Simulation Controls -->
        <div class="space-y-4">
            <h3 class="font-headline font-bold text-[10px] uppercase tracking-[0.2em] text-on-surface-variant flex items-center gap-2">
                <span class="material-symbols-outlined text-sm" data-icon="tune">tune</span>
                Controls
            </h3>
            <div class="space-y-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-label text-outline uppercase tracking-wider">Network Scenario</label>
                    <select id="scenario-select" class="w-full bg-surface-container-lowest border-none rounded-md text-sm text-on-surface font-body p-2 focus:ring-1 focus:ring-primary/50">
                        <option value="india" selected>India (25 nodes)</option>
                        <option value="reroute_test">Reroute Test</option>
                        <option value="volatile">Volatile (Stress Test)</option>
                        <option value="small">Test (4 nodes)</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-label text-outline uppercase tracking-wider">Agent Logic</label>
                    <select id="agent-select" class="w-full bg-surface-container-lowest border-none rounded-md text-sm text-on-surface font-body p-2 focus:ring-1 focus:ring-primary/50">
                        <option value="random">Random Baseline</option>
                        <option value="trained">Trained GNN+RL</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-label text-outline uppercase tracking-wider">Sim Speed</label>
                        <span id="speed-label" class="text-[10px] font-label text-primary font-bold">1.0s</span>
                    </div>
                    <input id="speed-slider" min="200" max="3000" value="1000" step="100" class="w-full h-1 bg-surface-container-lowest rounded-lg appearance-none cursor-pointer accent-primary" type="range"/>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-label text-outline uppercase tracking-wider">Random Seed</label>
                    <input id="seed-input" placeholder="Random" min="0" max="99999" class="w-full bg-surface-container-lowest border-none rounded-md text-sm font-label text-primary p-2 placeholder:text-outline/30" type="number"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button id="btn-simulate" class="bg-primary text-on-primary py-2.5 rounded-md font-bold text-xs active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
                    <span class="material-symbols-outlined text-sm" data-icon="play_arrow">play_arrow</span> RUN
                </button>
                <button id="btn-stop" disabled class="bg-surface-container-highest/50 text-error py-2.5 rounded-md font-bold text-xs hover:bg-error/10 transition-all flex items-center justify-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed">
                    <span class="material-symbols-outlined text-sm" data-icon="stop">stop</span> STOP
                </button>
            </div>
        </div>

        <div id="agent-status" class="px-4 py-2 bg-surface-container-lowest border border-outline-variant/10 rounded text-[10px] font-label text-primary text-center uppercase tracking-widest">Checking status...</div>

        <!-- Active Shipment -->
        <div class="space-y-4" id="shipment-card" style="display: none;">
            <h3 class="font-headline font-bold text-[10px] uppercase tracking-[0.2em] text-on-surface-variant">Active Shipment</h3>
            <div id="shipment-info" class="bg-surface-container-lowest p-4 rounded-xl border-l-2 border-primary">
                <!-- Populated by app.js -->
            </div>
        </div>

        <!-- Live Metrics -->
        <div class="space-y-4" id="metrics-card" style="display: none;">
            <h3 class="font-headline font-bold text-[10px] uppercase tracking-[0.2em] text-on-surface-variant">Live Performance</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-surface-container-lowest/50 p-3 rounded-lg border border-outline-variant/10">
                    <div class="text-[9px] text-outline uppercase font-label">Steps</div>
                    <div id="val-steps" class="text-lg font-label font-bold">—</div>
                </div>
                <div class="bg-surface-container-lowest/50 p-3 rounded-lg border border-outline-variant/10">
                    <div class="text-[9px] text-outline uppercase font-label">Total Cost</div>
                    <div id="val-cost" class="text-lg font-label font-bold text-primary">—</div>
                </div>
                <div class="bg-surface-container-lowest/50 p-3 rounded-lg border border-outline-variant/10">
                    <div class="text-[9px] text-outline uppercase font-label">Travel Time</div>
                    <div id="val-time" class="text-lg font-label font-bold">—</div>
                </div>
                <div class="bg-surface-container-lowest/50 p-3 rounded-lg border border-outline-variant/10">
                    <div class="text-[9px] text-outline uppercase font-label">Reward</div>
                    <div id="val-reward" class="text-lg font-label font-bold">—</div>
                </div>
                <div class="col-span-2 bg-surface-container-lowest/50 p-3 rounded-lg border border-outline-variant/10">
                    <div class="text-[9px] text-outline uppercase font-label">Cumulative Risk</div>
                    <div id="val-risk" class="text-lg font-label font-bold text-error">—</div>
                </div>
            </div>
            <div class="space-y-2">
                <div class="flex justify-between items-center text-[10px] font-label">
                    <span class="text-outline uppercase">Shelf Life Integrity</span>
                    <span id="val-shelf" class="text-primary font-bold">—</span>
                </div>
                <div class="w-full bg-surface-container-lowest h-1.5 rounded-full overflow-hidden">
                    <div id="shelf-bar" class="bg-primary h-full w-[0%] transition-all duration-500"></div>
                </div>
            </div>
        </div>

        <!-- Network Disruptions -->
        <div class="space-y-4" id="anomalies-card" style="display: none;">
            <h3 class="font-headline font-bold text-[10px] uppercase tracking-[0.2em] text-on-surface-variant flex items-center gap-2">
                 <span class="material-symbols-outlined text-sm text-error" data-icon="warning">warning</span>
                 Disruptions
            </h3>
            <div id="global-anomalies-list" class="space-y-2">
                <!-- Populated by app.js -->
            </div>
        </div>
    </div>
</aside>

<!-- Main Map Canvas -->
<main class="flex-1 relative bg-[#080e1d]">
    <div id="map" class="w-full h-full"></div>
    
    <!-- Delivery Overlay (Success/Failure) -->
    <div id="delivery-overlay" class="absolute inset-0 z-[2000] bg-surface/90 backdrop-blur-xl flex items-center justify-center pointer-events-none opacity-0 transition-all duration-500" style="display: none;">
        <div id="delivery-content" class="text-center p-12 rounded-3xl border border-outline-variant/20 max-w-lg glass-panel shadow-2xl scale-95 transition-transform duration-500">
            <!-- Populated by app.js -->
        </div>
    </div>
</main>

<!-- Right Log Panel -->
<aside class="bg-surface-container-low w-80 border-l border-outline-variant/10 flex flex-col h-full">
    <div class="p-6 flex-shrink-0 flex items-center justify-between border-b border-outline-variant/10">
        <h3 class="font-headline font-bold text-[10px] uppercase tracking-[0.2em] text-on-surface-variant">Telemetry Log</h3>
        <span class="font-label text-[9px] text-primary bg-primary/10 px-2 py-0.5 rounded-full border border-primary/20">LIVE</span>
    </div>
    <div id="step-log" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="log-placeholder flex flex-col items-center justify-center h-full opacity-30 text-center space-y-4">
            <span class="material-symbols-outlined text-4xl">database_off</span>
            <p class="text-xs uppercase tracking-widest">Waiting for stream...</p>
        </div>
    </div>
</aside>
</div>

<!-- Status Bar Footer -->
<footer class="fixed bottom-0 left-0 right-0 bg-surface-container-lowest h-8 z-50 border-t border-outline-variant/10 px-6 flex items-center justify-between text-[10px] font-label text-outline uppercase tracking-[0.1em]">
<div class="flex gap-8">
    <span class="flex items-center gap-2 text-primary font-bold"><span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span> ONLINE</span>
    <span id="footer-scenario" class="hidden md:inline">SYSTEM: ACTIVE</span>
</div>
<div class="flex gap-6">
    <span>v4.2.0-STABLE</span>
</div>
</footer>

<script src="/static/app.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap&libraries=geometry" async defer></script>
</body>
</html>
